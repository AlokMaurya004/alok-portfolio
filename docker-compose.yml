services:
  portfolio-web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: alok-portfolio:latest
    container_name: portfolio-web
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "com.alok.description=Cloud-Native Portfolio Website"
      - "com.alok.version=1.0"
